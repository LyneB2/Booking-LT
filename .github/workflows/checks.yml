name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Use runner Chrome or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            BOOKING_CHROME_PATH="$(command -v google-chrome)"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$BOOKING_CHROME_PATH" >> "$GITHUB_ENV"
            "$BOOKING_CHROME_PATH" --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
